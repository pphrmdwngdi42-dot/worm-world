<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Worm World 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans Thai",sans-serif;background:#07100d;color:#fff}
button{font-family:inherit;border:0;cursor:pointer;color:#fff}.screen{position:absolute;inset:0}
#lobby{display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 10%,#467d50,#10271a 40%,#050b08 90%);overflow:hidden}
.forestGlow{position:absolute;width:500px;height:500px;border-radius:50%;background:#55ff8a;filter:blur(140px);opacity:.12}
.lobbyBox{position:relative;width:min(94vw,520px);max-height:96vh;padding:24px;border-radius:32px;background:linear-gradient(145deg,rgba(30,56,40,.96),rgba(8,20,15,.96));border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 100px rgba(0,0,0,.65),inset 0 1px rgba(255,255,255,.1);overflow:auto}
.logo{text-align:center;font-size:54px;filter:drop-shadow(0 10px 15px rgba(0,0,0,.5));animation:floatLogo 2.5s ease-in-out infinite}
@keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.gameTitle{text-align:center;font-size:38px;font-weight:900;letter-spacing:2px;text-shadow:0 5px 20px rgba(0,0,0,.5)}
.gameSub{text-align:center;color:#9eddb0;margin-top:5px;margin-bottom:18px}
.playerCard{display:flex;align-items:center;gap:12px;padding:13px;border-radius:18px;background:rgba(255,255,255,.07);margin-bottom:14px}
.avatar{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(145deg,#6eff9a,#15944d);font-size:30px}
.playerInfo{flex:1}.playerName{font-weight:bold;font-size:17px}.levelText{color:#a6d8b4;font-size:13px}
.progress{height:7px;margin-top:6px;border-radius:20px;overflow:hidden;background:#0a1710}.progressFill{width:45%;height:100%;background:linear-gradient(90deg,#6effa0,#00e878);border-radius:20px}
.playButton{width:100%;padding:17px;border-radius:18px;color:white;font-size:22px;font-weight:900;background:linear-gradient(135deg,#45f283,#0ba95b);box-shadow:0 8px 0 #08713d,0 15px 35px rgba(0,255,110,.2);transition:.15s}
.playButton:active{transform:translateY(6px);box-shadow:0 2px 0 #08713d}
.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.menuButton{padding:13px 5px;border-radius:15px;color:white;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07)}
.menuIcon{display:block;font-size:24px;margin-bottom:5px}
.panel{display:none;position:absolute;inset:0;z-index:100;padding:25px;background:rgba(3,10,7,.96);overflow:auto}
.panelInner{max-width:600px;margin:auto}.panelHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.closeButton{width:42px;height:42px;border-radius:50%;background:#24372b;color:#fff;font-size:20px}
.shopGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.skinCard{padding:15px;border-radius:18px;background:#14241b;border:1px solid #294632}
.skinPreview{height:110px;display:flex;justify-content:center;align-items:center;font-size:55px;border-radius:15px;background:radial-gradient(circle,#263e2c,#0d1711);margin-bottom:10px}
.buyButton{width:100%;padding:11px;margin-top:8px;border-radius:12px;color:#fff;background:#2d8c53}.buyButton.locked{background:#4b4b4b}
.mission{padding:16px;margin-bottom:10px;border-radius:17px;background:#14241b}.missionTop{display:flex;justify-content:space-between}
.missionBar{margin-top:9px;height:7px;border-radius:10px;background:#07100b;overflow:hidden}.missionFill{height:100%;background:#ffd33d}
#game{display:none;background:#102217;overflow:hidden}#world{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.hudGroup{display:flex;gap:7px}.hudBox{padding:9px 12px;border-radius:14px;background:rgba(0,0,0,.52);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);font-size:13px}
.energy{position:absolute;z-index:21;left:50%;bottom:25px;transform:translateX(-50%);width:180px;text-align:center}.energyBar{height:9px;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.55)}.energyFill{height:100%;width:100%;background:linear-gradient(90deg,#ffb52e,#ffef57);transition:.1s}
.joystick{position:absolute;z-index:30;left:22px;bottom:25px;width:145px;height:145px;border-radius:50%;background:rgba(255,255,255,.055);border:2px solid rgba(255,255,255,.10);backdrop-filter:blur(5px);touch-action:none}
.joystickKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin-left:-31px;margin-top:-31px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.18);box-shadow:0 8px 25px rgba(0,0,0,.25);pointer-events:none}
.boostButton{position:absolute;z-index:30;right:24px;bottom:45px;width:85px;height:85px;border-radius:50%;background:rgba(255,165,35,.13);border:2px solid rgba(255,200,80,.3);color:#fff;font-size:28px;touch-action:none}
.boostButton:active{background:rgba(255,180,40,.28);transform:scale(.94)}
#gameOver{display:none;position:absolute;inset:0;z-index:100;align-items:center;justify-content:center;background:rgba(0,0,0,.75);padding:20px}
.gameOverBox{width:min(90%,400px);padding:28px;border-radius:25px;text-align:center;background:#14251a}.gameOverBox h2{font-size:35px;margin-bottom:10px}
.gameButton{width:100%;padding:14px;margin-top:10px;border-radius:13px;color:#fff;background:#2e9d59;font-weight:bold}
@media(min-width:800px){.joystick,.boostButton{display:none}}
</style>
</head>
<body>
<section id="lobby" class="screen">
<div class="forestGlow"></div><div class="lobbyBox">
<div class="logo">🐛</div><div class="gameTitle">WORM WORLD</div><div class="gameSub">Grow • Explore • Survive</div>
<div class="playerCard"><div class="avatar">🐛</div><div class="playerInfo"><div class="playerName" id="lobbyName">ผู้เล่น</div><div class="levelText">LEVEL <span id="lobbyLevel">1</span></div><div class="progress"><div class="progressFill" id="xpBar"></div></div></div><div>🪙 <span id="lobbyCoins">100</span></div></div>
<button class="playButton" onclick="startGame()">▶ PLAY</button>
<div class="menuGrid">
<button class="menuButton" onclick="openShop()"><span class="menuIcon">🎨</span>SKINS</button>
<button class="menuButton" onclick="openMissions()"><span class="menuIcon">🎯</span>MISSIONS</button>
<button class="menuButton" onclick="showInfo()"><span class="menuIcon">🌎</span>WORLD</button>
</div></div></section>

<section id="shopPanel" class="panel"><div class="panelInner"><div class="panelHeader"><h1>🎨 SKINS</h1><button class="closeButton" onclick="closePanels()">×</button></div><div class="shopGrid" id="shopGrid"></div></div></section>
<section id="missionPanel" class="panel"><div class="panelInner"><div class="panelHeader"><h1>🎯 ภารกิจ</h1><button class="closeButton" onclick="closePanels()">×</button></div><div id="missionList"></div></div></section>

<section id="game" class="screen">
<canvas id="world"></canvas>
<div class="hud"><div class="hudGroup"><div class="hudBox">⭐ <span id="score">0</span></div><div class="hudBox">🐛 <span id="length">5</span></div><div class="hudBox">🪙 <span id="gameCoins">0</span></div></div><div class="hudBox">LV. <span id="gameLevel">1</span></div></div>
<div class="energy"><div style="font-size:12px;margin-bottom:4px">⚡ BOOST</div><div class="energyBar"><div id="energyFill" class="energyFill"></div></div></div>
<div id="joystick" class="joystick"><div id="joystickKnob" class="joystickKnob"></div></div>
<button id="boostButton" class="boostButton">⚡</button>
<div id="gameOver"><div class="gameOverBox"><h2>💀 GAME OVER</h2><p>คะแนน: <b id="finalScore">0</b></p><p>ความยาว: <b id="finalLength">0</b></p><p>Level: <b id="finalLevel">1</b></p><button class="gameButton" onclick="startGame()">🔄 เล่นอีกครั้ง</button><button class="gameButton" onclick="backLobby()">🏠 Lobby</button></div></div>
</section>

<script>
const SAVE_KEY="worm_world_save_v2";
let save=JSON.parse(localStorage.getItem(SAVE_KEY))||{name:"ผู้เล่น",level:1,xp:0,coins:100,owned:["thai"],selected:"thai",missions:{eat:0,coins:0,length:0}};
function saveGame(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
const skins=[
{id:"thai",name:"ไทย 🇹🇭",icon:"🇹🇭",price:0,body:"#e94343",light:"#ff7777"},
{id:"japan",name:"ญี่ปุ่น 🇯🇵",icon:"🇯🇵",price:150,body:"#f4f4f4",light:"#ff5656"},
{id:"usa",name:"อเมริกา 🇺🇸",icon:"🇺🇸",price:250,body:"#4169e1",light:"#ff4d5a"},
{id:"korea",name:"เกาหลี 🇰🇷",icon:"🇰🇷",price:350,body:"#202020",light:"#eeeeee"},
{id:"uk",name:"อังกฤษ 🇬🇧",icon:"🇬🇧",price:450,body:"#3558ce",light:"#e73f52"},
{id:"gold",name:"ราชาทอง 👑",icon:"👑",price:1000,body:"#eabf22",light:"#fff09a"},
{id:"ice",name:"น้ำแข็ง ❄️",icon:"❄️",price:700,body:"#38dfff",light:"#c2f9ff"},
{id:"poison",name:"พิษ ☠️",icon:"☠️",price:800,body:"#73e62e",light:"#c8ff72"},
{id:"rainbow",name:"Rainbow 🌈",icon:"🌈",price:1500,body:"rainbow",light:"#fff"}];
function updateLobby(){lobbyName.textContent=save.name;lobbyLevel.textContent=save.level;lobbyCoins.textContent=save.coins;xpBar.style.width=Math.min(100,save.xp/(save.level*100)*100)+"%"}
updateLobby();
function openShop(){shopPanel.style.display="block";shopGrid.innerHTML="";skins.forEach(s=>{let owned=save.owned.includes(s.id),selected=save.selected===s.id;let c=document.createElement("div");c.className="skinCard";c.innerHTML=`<div class="skinPreview">${s.icon}</div><b>${s.name}</b><div style="color:#9dc8aa;font-size:13px;margin-top:5px">${owned?"ปลดล็อกแล้ว":"🪙 "+s.price}</div><button class="buyButton ${!owned?"locked":""}" onclick="selectSkin('${s.id}')">${selected?"✓ ใช้อยู่":owned?"ใช้ Skin":"ซื้อ"}</button>`;shopGrid.appendChild(c)})}
function selectSkin(id){let s=skins.find(x=>x.id===id);if(!s)return;if(!save.owned.includes(id)){if(save.coins<s.price){alert("เหรียญไม่พอ 🪙");return}save.coins-=s.price;save.owned.push(id)}save.selected=id;saveGame();updateLobby();openShop()}
const missionData=[{id:"eat",title:"🍎 กินอาหาร",target:20,reward:100},{id:"coins",title:"🪙 เก็บเหรียญ",target:10,reward:150},{id:"length",title:"🐛 โตให้ยาว",target:30,reward:200}];
function openMissions(){missionPanel.style.display="block";missionList.innerHTML="";missionData.forEach(m=>{let v=save.missions[m.id]||0,p=Math.min(100,v/m.target*100);missionList.innerHTML+=`<div class="mission"><div class="missionTop"><b>${m.title}</b><span>🪙 ${m.reward}</span></div><div style="font-size:13px;color:#a7c9b0;margin-top:5px">${Math.min(v,m.target)} / ${m.target}</div><div class="missionBar"><div class="missionFill" style="width:${p}%"></div></div></div>`})}
function closePanels(){document.querySelectorAll(".panel").forEach(x=>x.style.display="none")}
function showInfo(){alert("WORLD GENERATION\\n\\n🌲 ป่าสุ่มใหม่ทุกเกม\\n🗺️ แมพขนาดใหญ่ 8000×8000\\n🔴 ขอบแดงคือเขตอันตราย\\n🤖 หนอน AI\\n👑 Boss เมื่อโตถึงระดับหนึ่ง\\n🪙 เหรียญและอาหารสุ่ม\\n\\nMultiplayer จริงต้องต่อ Server/WebSocket")}
const canvas=document.getElementById("world"),ctx=canvas.getContext("2d");let W,H;function resizeCanvas(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener("resize",resizeCanvas);resizeCanvas();
let world={width:8000,height:8000,border:180,trees:[],bushes:[],rocks:[],food:[],coins:[]};
let player,enemies=[],boss=null,running=false,score=0,gameCoins=0,camera={x:0,y:0},boost=false,boostEnergy=100,joystick={x:0,y:0};
function randomSafeX(){return world.border+100+Math.random()*(world.width-world.border*2-200)}
function randomSafeY(){return world.border+100+Math.random()*(world.height-world.border*2-200)}
function generateWorld(){world.trees=[];world.bushes=[];world.rocks=[];world.food=[];world.coins=[];for(let i=0;i<250;i++)world.trees.push({x:Math.random()*world.width,y:Math.random()*world.height,scale:.7+Math.random()*1.5});for(let i=0;i<400;i++)world.bushes.push({x:Math.random()*world.width,y:Math.random()*world.height,scale:.5+Math.random()});for(let i=0;i<180;i++)world.rocks.push({x:Math.random()*world.width,y:Math.random()*world.height,r:8+Math.random()*25});for(let i=0;i<180;i++)world.food.push({x:randomSafeX(),y:randomSafeY(),r:5+Math.random()*5,type:Math.floor(Math.random()*6)});for(let i=0;i<50;i++)world.coins.push({x:randomSafeX(),y:randomSafeY(),r:9,rot:Math.random()*Math.PI})}
function createWorm(x,y,isPlayer=false){let segments=[],length=isPlayer?7:10+Math.floor(Math.random()*12);for(let i=0;i<length;i++)segments.push({x:x-i*24,y});return{x,y,segments,dirX:1,dirY:0,targetX:1,targetY:0,speed:isPlayer?2.8:1.5+Math.random()*1.3,isPlayer,name:isPlayer?save.name:randomName(),skin:isPlayer?save.selected:randomEnemySkin(),aiTimer:0,alive:true}}
function randomName(){return["Mango","Ninja","Leo","Tiger","Jelly","Dragon","Panda","Ghost","Lucky","Bamboo","Turbo"][Math.floor(Math.random()*11)]}
function randomEnemySkin(){return skins[Math.floor(Math.random()*skins.length)].id}
function startGame(){closePanels();lobby.style.display="none";game.style.display="block";gameOver.style.display="none";generateWorld();player=createWorm(world.width/2,world.height/2,true);enemies=[];for(let i=0;i<12;i++)enemies.push(createWorm(randomSafeX(),randomSafeY(),false));boss=null;score=0;gameCoins=0;boostEnergy=100;camera.x=player.x-W/2;camera.y=player.y-H/2;running=true;requestAnimationFrame(gameLoop)}
document.addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key.toLowerCase()==="w"){joystick.x=0;joystick.y=-1}if(e.key==="ArrowDown"||e.key.toLowerCase()==="s"){joystick.x=0;joystick.y=1}if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a"){joystick.x=-1;joystick.y=0}if(e.key==="ArrowRight"||e.key.toLowerCase()==="d"){joystick.x=1;joystick.y=0}});
const joystickEl=document.getElementById("joystick"),knob=document.getElementById("joystickKnob");let joystickActive=false;
function joystickMove(clientX,clientY){let r=joystickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,max=r.width/2-32,dist=Math.sqrt(dx*dx+dy*dy);if(dist>max){dx=dx/dist*max;dy=dy/dist*max}knob.style.transform=`translate(${dx}px,${dy}px)`;joystick.x=dx/max;joystick.y=dy/max}
function joystickEnd(){joystickActive=false;knob.style.transform="translate(0,0)";joystick.x=0;joystick.y=0}
joystickEl.addEventListener("pointerdown",e=>{joystickActive=true;joystickMove(e.clientX,e.clientY)});joystickEl.addEventListener("pointermove",e=>{if(joystickActive)joystickMove(e.clientX,e.clientY)});joystickEl.addEventListener("pointerup",joystickEnd);joystickEl.addEventListener("pointercancel",joystickEnd);
boostButton.addEventListener("pointerdown",()=>boost=true);boostButton.addEventListener("pointerup",()=>boost=false);boostButton.addEventListener("pointercancel",()=>boost=false);boostButton.addEventListener("pointerleave",()=>boost=false);
function distance(a,b){let dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function update(){if(!player.alive)return;if(Math.abs(joystick.x)+Math.abs(joystick.y)>.1){let len=Math.sqrt(joystick.x*joystick.x+joystick.y*joystick.y);player.targetX=joystick.x/len;player.targetY=joystick.y/len}player.dirX+=(player.targetX-player.dirX)*.15;player.dirY+=(player.targetY-player.dirY)*.15;let dl=Math.sqrt(player.dirX*player.dirX+player.dirY*player.dirY);if(dl){player.dirX/=dl;player.dirY/=dl}let speed=player.speed;if(boost&&boostEnergy>0){speed*=2.25;boostEnergy-=1.5;if(boostEnergy%8<1&&player.segments.length>7)player.segments.pop()}else boostEnergy=Math.min(100,boostEnergy+.35);let head=player.segments[0],nh={x:head.x+player.dirX*speed,y:head.y+player.dirY*speed};player.segments.unshift(nh);player.x=nh.x;player.y=nh.y;let ate=false;
for(let i=world.food.length-1;i>=0;i--){let f=world.food[i];if(distance(nh,f)<24){world.food.splice(i,1);world.food.push({x:randomSafeX(),y:randomSafeY(),r:5+Math.random()*5,type:Math.floor(Math.random()*6)});score+=10;ate=true;addXP(4);save.missions.eat++;break}}
for(let i=world.coins.length-1;i>=0;i--){let c=world.coins[i];if(distance(nh,c)<28){world.coins.splice(i,1);world.coins.push({x:randomSafeX(),y:randomSafeY(),r:9,rot:0});gameCoins++;score+=25;save.missions.coins++;addXP(8)}}
if(!ate)player.segments.pop();
if(nh.x<world.border||nh.y<world.border||nh.x>world.width-world.border||nh.y>world.height-world.border){gameOver();return}
for(let i=12;i<player.segments.length;i++)if(distance(nh,player.segments[i])<15){gameOver();return}
enemies.forEach(updateAI);if(!boss&&player.segments.length>35)spawnBoss();if(boss)updateAI(boss);camera.x+=(player.x-W/2-camera.x)*.08;camera.y+=(player.y-H/2-camera.y)*.08;scoreEl.textContent=score;length.textContent=player.segments.length;gameCoinsEl.textContent=gameCoins;gameLevel.textContent=save.level;energyFill.style.width=boostEnergy+"%";save.missions.length=Math.max(save.missions.length,player.segments.length)}
function updateAI(w){if(!w.alive)return;w.aiTimer--;if(w.aiTimer<=0){w.aiTimer=40+Math.random()*100;if(distance(w.segments[0],player.segments[0])<500&&Math.random()<.45){let dx=player.x-w.x,dy=player.y-w.y,d=Math.sqrt(dx*dx+dy*dy);w.targetX=dx/d;w.targetY=dy/d}else{let a=Math.random()*Math.PI*2;w.targetX=Math.cos(a);w.targetY=Math.sin(a)}}w.dirX+=(w.targetX-w.dirX)*.05;w.dirY+=(w.targetY-w.dirY)*.05;let len=Math.sqrt(w.dirX*w.dirX+w.dirY*w.dirY);if(len){w.dirX/=len;w.dirY/=len}let h=w.segments[0],nh={x:h.x+w.dirX*w.speed,y:h.y+w.dirY*w.speed};if(nh.x<world.border+50||nh.x>world.width-world.border-50||nh.y<world.border+50||nh.y>world.height-world.border-50){w.targetX=-w.dirX;w.targetY=-w.dirY}w.segments.unshift(nh);w.x=nh.x;w.y=nh.y;let ate=false;for(let i=world.food.length-1;i>=0;i--)if(distance(nh,world.food[i])<20){world.food.splice(i,1);world.food.push({x:randomSafeX(),y:randomSafeY(),r:6,type:Math.floor(Math.random()*6)});ate=true;break}if(!ate)w.segments.pop();if(distance(nh,player.segments[0])<22&&w.segments.length<player.segments.length){w.alive=false;score+=100;addXP(25)}}
function spawnBoss(){boss=createWorm(randomSafeX(),randomSafeY(),false);boss.name="👑 FOREST KING";boss.skin="gold";boss.speed=1.8;boss.segments=boss.segments.concat(boss.segments,boss.segments)}
function bossCollision(){if(!boss)return;if(distance(player.segments[0],boss.segments[0])<30){if(player.segments.length>boss.segments.length){boss=null;score+=1000;addXP(200)}else gameOver()}}
function addXP(a){save.xp+=a;let need=save.level*100;if(save.xp>=need){save.xp-=need;save.level++;score+=500}saveGame();updateLobby()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-camera.x,-camera.y);ctx.fillStyle="#183822";ctx.fillRect(0,0,world.width,world.height);let g=ctx.createRadialGradient(player.x,player.y,100,player.x,player.y,1800);g.addColorStop(0,"rgba(120,255,150,.10)");g.addColorStop(1,"rgba(0,0,0,.18)");ctx.fillStyle=g;ctx.fillRect(0,0,world.width,world.height);ctx.strokeStyle="rgba(255,255,255,.025)";for(let x=0;x<world.width;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.height);ctx.stroke()}for(let y=0;y<world.height;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.width,y);ctx.stroke()}ctx.fillStyle="rgba(255,30,30,.16)";ctx.fillRect(0,0,world.width,world.border);ctx.fillRect(0,world.height-world.border,world.width,world.border);ctx.fillRect(0,0,world.border,world.height);ctx.fillRect(world.width-world.border,0,world.border,world.height);ctx.strokeStyle="#ff2929";ctx.lineWidth=15;ctx.strokeRect(world.border/2,world.border/2,world.width-world.border,world.height-world.border);world.trees.forEach(drawTree);world.bushes.forEach(drawBush);world.rocks.forEach(drawRock);world.food.forEach(drawFood);world.coins.forEach(drawCoin);enemies.forEach(w=>{if(w.alive)drawWorm(w)});if(boss)drawWorm(boss,true);drawWorm(player);ctx.restore()}
function drawTree(t){let s=t.scale;ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(0,20*s,35*s,13*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#6d492e";ctx.fillRect(-7*s,-10*s,14*s,45*s);let g=ctx.createRadialGradient(0,-40*s,5*s,0,-40*s,55*s);g.addColorStop(0,"#63d86b");g.addColorStop(1,"#1b713b");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-45*s,42*s,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawBush(b){ctx.fillStyle="#246e39";ctx.beginPath();ctx.arc(b.x,b.y,18*b.scale,0,Math.PI*2);ctx.fill()}
function drawRock(r){ctx.fillStyle="#53625a";ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill()}
function drawFood(f){let colors=["#ffdc3e","#ff5555","#55dfff","#bd65ff","#5dff78","#ff7ad9"];ctx.shadowBlur=15;ctx.shadowColor=colors[f.type];ctx.fillStyle=colors[f.type];ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
function drawCoin(c){c.rot+=.08;ctx.save();ctx.translate(c.x,c.y);ctx.scale(Math.abs(Math.cos(c.rot)),1);ctx.fillStyle="#ffd52e";ctx.shadowBlur=15;ctx.shadowColor="#ffd52e";ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#a66d00";ctx.font="bold 11px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("$",0,1);ctx.restore()}
function drawWorm(w,isBoss=false){let skin=skins.find(x=>x.id===w.skin)||skins[0],head=w.segments[0];ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(head.x,head.y+14,35,12,0,0,Math.PI*2);ctx.fill();for(let i=w.segments.length-1;i>=0;i--){let s=w.segments[i],r=Math.min(23,13+w.segments.length*.05);ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);if(skin.body==="rainbow"){let hue=(i*20+Date.now()/8)%360;ctx.fillStyle=`hsl(${hue},100%,55%)`}else ctx.fillStyle=i===0?skin.light:skin.body;ctx.fill();ctx.strokeStyle="rgba(0,0,0,.25)";ctx.lineWidth=2;ctx.stroke();if(i%2===0){ctx.fillStyle="rgba(255,255,255,.12)";ctx.beginPath();ctx.arc(s.x-r*.25,s.y-r*.35,r*.25,0,Math.PI*2);ctx.fill()}}drawEyes(w,head,isBoss);drawName(w,head,isBoss)}
function drawEyes(w,head,isBoss){let dx=w.dirX,dy=w.dirY,sx=-dy,sy=dx,ed=isBoss?10:7,es=isBoss?10:7;[{x:head.x+dx*8+sx*ed,y:head.y+dy*8+sy*ed},{x:head.x+dx*8-sx*ed,y:head.y+dy*8-sy*ed}].forEach(e=>{ctx.fillStyle="white";ctx.beginPath();ctx.arc(e.x,e.y,es,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(e.x+dx*3,e.y+dy*3,es*.48,0,Math.PI*2);ctx.fill();ctx.fillStyle="white";ctx.beginPath();ctx.arc(e.x+dx*4,e.y+dy*4-2,2,0,Math.PI*2);ctx.fill()})}
function drawName(w,head,boss){ctx.save();ctx.font=boss?"bold 16px Arial":"bold 13px Arial";ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillStyle=boss?"#ffe84d":"white";ctx.shadowBlur=5;ctx.shadowColor="black";ctx.fillText(w.name,head.x,head.y-35);ctx.restore()}
let lastTime=0;function gameLoop(time){if(!running)return;if(time-lastTime>15){update();bossCollision();draw();lastTime=time}requestAnimationFrame(gameLoop)}
function gameOver(){if(!running)return;running=false;save.coins+=gameCoins;saveGame();updateLobby();finalScore.textContent=score;finalLength.textContent=player.segments.length;finalLevel.textContent=save.level;document.getElementById("gameOver").style.display="flex"}
function backLobby(){running=false;game.style.display="none";lobby.style.display="flex";updateLobby()}
</script>
